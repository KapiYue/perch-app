server {
    listen 80;
    listen [::]:80;
    server_name perch.joy-coder.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name perch.joy-coder.com;

    root /var/www/perch;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/perch/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/perch/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PERCH_SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        try_files /index.html =404;
    }

    # 让 /privacy 直接返回 200，而不是先 301 到 /privacy/
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # DMG 走 COS，不占服务器带宽。这里只留一条兜底跳转，
    # 万一有人手敲 /dl/... 也不会 404。真正的下载按钮直接指向 COS 域名。
    location /dl/ {
        return 302 https://perch-dist-1305706023.cos.ap-guangzhou.myqcloud.com$request_uri;
    }
}
