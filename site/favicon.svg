<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Perch">
  <title>Perch 栖架</title>
  <!--
    和站点导航栏里的品牌标记（site.css 的 .brand .mark）是同一套几何：
    24px 的黑色圆角方块 + 顶部正中垂下来的一条强调色黑条，比例按 64/24 等比放大。
      圆角 7 → 18.5   黑条 13×7 → 34.5×18.5   黑条下沿圆角 4 → 10.5
    改站点标记的话这里要一起改，否则标签页图标和页头会对不上。

    描边不能省：方块是纯黑的，深色标签页背景下不描边就整个化掉了，
    只剩一条蓝杠浮在那儿。透明度取 line-s 那个变量的值（.14），和页头那圈一致。

    注意 XML 注释里不能出现两个连续的减号，写 CSS 变量名时要绕开。
  -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="18.5"
        fill="#000" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
  <path d="M14.75 0 H49.25 V8 A10.5 10.5 0 0 1 38.75 18.5 H25.25 A10.5 10.5 0 0 1 14.75 8 Z"
        fill="#0a84ff"/>
</svg>
